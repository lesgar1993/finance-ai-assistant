<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transações — Finance AI</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Botão hamburger (mobile) -->
<button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir menu">☰</button>

<!-- Overlay sidebar (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-layout">

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-brand">
            <div class="brand-icon">💹</div>
            <div>
                <span class="brand-name">Finance AI</span>
                <span class="brand-sub">Assistente Financeiro</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <p class="nav-label">Menu</p>

            <a href="index.html">
                <span class="nav-icon">🏠</span>
                Dashboard
            </a>

            <a href="transacoes.html" class="active">
                <span class="nav-icon">💰</span>
                Transações
            </a>

            <a href="ai.html">
                <span class="nav-icon">🤖</span>
                Finance AI
            </a>
        </nav>

        <div class="sidebar-footer">
            Finance AI &copy; 2025
        </div>
    </aside>
    <!-- ── FIM SIDEBAR ── -->

    <!-- ── CONTEÚDO PRINCIPAL ── -->
    <div class="main-content">

        <header class="topbar">
            <span class="topbar-title">Transações</span>
            <span class="topbar-badge">💳 Todas as movimentações</span>
        </header>

        <main class="page-body">

            <!-- ── BARRA DE FILTROS ── -->
            <!--
                Filtros locais: filtra os dados já carregados da API,
                sem fazer novas requisições.
            -->
            <div class="filter-bar">
                <span class="filter-label">Filtrar por:</span>

                <select id="filterType" title="Tipo">
                    <option value="">Todos os tipos</option>
                    <option value="INCOME">💚 Receitas</option>
                    <option value="EXPENSE">❤️ Despesas</option>
                </select>

                <select id="filterCategory" title="Categoria">
                    <option value="">Todas as categorias</option>
                    <option value="SALARY">💼 Salário</option>
                    <option value="FOOD">🍔 Alimentação</option>
                    <option value="TRANSPORT">🚗 Transporte</option>
                    <option value="HOUSING">🏠 Moradia</option>
                    <option value="HEALTH">💊 Saúde</option>
                    <option value="LEISURE">🎮 Lazer</option>
                    <option value="OTHER">📦 Outros</option>
                </select>

                <input
                    type="text"
                    id="filterSearch"
                    placeholder="🔍 Buscar por descrição..."
                    style="flex:1; min-width: 160px;"
                />

                <button class="btn btn-secondary btn-sm" id="btnClearFilters">
                    ✕ Limpar filtros
                </button>
            </div>

            <!-- ── CABEÇALHO DA SEÇÃO ── -->
            <div class="section-header">
                <h2 class="section-title">
                    Todas as transações
                    <!-- Contador de registros exibidos -->
                    <span
                        id="txCount"
                        style="font-size:13px; font-weight:400; color:var(--gray-600); margin-left:8px;"
                    ></span>
                </h2>
                <button class="btn btn-primary" id="btnNewTransaction">
                    ＋ Nova transação
                </button>
            </div>

            <!-- ── TABELA ── -->
            <div class="table-card">
                <div class="table-responsive">
                    <table id="transactionsTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Descrição</th>
                                <th>Categoria</th>
                                <th>Valor</th>
                                <th>Tipo</th>
                                <th>Data</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsBody">
                            <!-- Skeletons de carregamento -->
                            <tr class="skeleton-row">
                                <td><div class="skeleton skeleton-cell" style="width:24px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:150px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:90px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:90px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:70px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:90px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:110px"></div></td>
                            </tr>
                            <tr class="skeleton-row">
                                <td><div class="skeleton skeleton-cell" style="width:24px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:130px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:80px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:95px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:70px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:90px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:110px"></div></td>
                            </tr>
                            <tr class="skeleton-row">
                                <td><div class="skeleton skeleton-cell" style="width:24px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:170px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:85px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:80px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:70px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:90px"></div></td>
                                <td><div class="skeleton skeleton-cell" style="width:110px"></div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- ── FIM TABELA ── -->

        </main>
    </div>
    <!-- ── FIM CONTEÚDO PRINCIPAL ── -->

</div>


<!-- =============================================
     MODAL — Nova / Editar Transação
     ============================================= -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

        <div class="modal-header">
            <h3 class="modal-title" id="modalTitle">Nova transação</h3>
            <button class="modal-close" id="modalClose" aria-label="Fechar">✕</button>
        </div>

        <div class="modal-body">
            <form id="transactionForm" novalidate>

                <input type="hidden" id="fieldId" />

                <!-- Descrição -->
                <div class="form-group">
                    <label class="form-label" for="fieldDescription">Descrição *</label>
                    <input
                        type="text"
                        id="fieldDescription"
                        class="form-control"
                        placeholder="Ex: Salário, Aluguel, Supermercado..."
                        maxlength="120"
                    />
                </div>

                <!-- Valor -->
                <div class="form-group">
                    <label class="form-label" for="fieldAmount">Valor (R$) *</label>
                    <input
                        type="number"
                        id="fieldAmount"
                        class="form-control"
                        placeholder="0,00"
                        min="0.01"
                        step="0.01"
                    />
                </div>

                <!-- Tipo -->
                <div class="form-group">
                    <label class="form-label" for="fieldType">Tipo *</label>
                    <select id="fieldType" class="form-control">
                        <option value="">Selecione o tipo</option>
                        <option value="INCOME">💚 Receita</option>
                        <option value="EXPENSE">❤️ Despesa</option>
                    </select>
                </div>

                <!-- Categoria -->
                <div class="form-group">
                    <label class="form-label" for="fieldCategory">Categoria *</label>
                    <select id="fieldCategory" class="form-control">
                        <option value="">Selecione a categoria</option>
                        <option value="SALARY">💼 Salário</option>
                        <option value="FOOD">🍔 Alimentação</option>
                        <option value="TRANSPORT">🚗 Transporte</option>
                        <option value="HOUSING">🏠 Moradia</option>
                        <option value="HEALTH">💊 Saúde</option>
                        <option value="LEISURE">🎮 Lazer</option>
                        <option value="OTHER">📦 Outros</option>
                    </select>
                </div>

            </form>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" id="btnCancel">Cancelar</button>
            <button class="btn btn-primary" id="btnSave">
                <span id="btnSaveLabel">Salvar</span>
            </button>
        </div>
    </div>
</div>
<!-- ── FIM MODAL ── -->


<script src="js/transacoes.js"></script>

</body>
</html>
