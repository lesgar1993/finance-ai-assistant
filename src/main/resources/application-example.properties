spring.application.name=finance-ai-assistant

# Banco H2
spring.datasource.url=jdbc:h2:mem:financeai
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ollama / Spring AI
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3:4b

# Whisper
whisper.executable=C:/CAMINHO/PARA/whisper-cli.exe
whisper.model=C:/CAMINHO/PARA/ggml-base.bin

# FFmpeg
ffmpeg.executable=ffmpeg

# Upload de áudio
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Encoding UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true